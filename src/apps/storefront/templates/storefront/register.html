{% extends "storefront/base.html" %}
{% load strings %}
{% block content %}
<div class="auth-card">
    <h2>{% tr 'Register' %}</h2>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="form-field" style="margin-bottom:.75rem"><label for="id-email">{% tr 'Email' %}</label><input id="id-email" name="email" type="email"></div>
        <div class="form-field" style="margin-bottom:1rem"><label for="id-password">{% tr 'Password' %}</label><input id="id-password" name="password" type="password"></div>
        <button class="btn btn-primary" type="submit">{% tr 'Register' %}</button>
    </form>
    <p class="auth-switch">{% tr 'Already have an account?' %} <a href="{% url 'storefront:login' %}">{% tr 'Login' %}</a></p>
</div>
{% endblock %}
