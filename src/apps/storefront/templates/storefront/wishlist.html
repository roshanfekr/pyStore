{% extends "storefront/base.html" %}
{% load strings %}
{% block content %}
<div class="page-title"><h2>{% tr 'Wishlist' %}</h2></div>
{% if items %}
<div class="list-rows">
    {% for item in items %}
        <div class="list-row">
            <div><strong>{{ item.product.name }}</strong></div>
            <form method="post" action="{% url 'storefront:wishlist_move' item.product.id %}">
                {% csrf_token %}
                <button class="btn btn-primary btn-sm" type="submit">{% tr 'Move to cart' %}</button>
            </form>
        </div>
    {% endfor %}
</div>
{% else %}<div class="empty-state"><span class="icon">&#10084;</span>{% tr 'Wishlist is empty.' %}</div>{% endif %}
{% endblock %}
