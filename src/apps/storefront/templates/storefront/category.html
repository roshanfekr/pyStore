{% extends "storefront/base.html" %}
{% load strings %}
{% block content %}
<div class="page-title">
    <h2>{{ category.name }}</h2>
    <span class="count">{{ products|length }} {% tr 'items' %}</span>
</div>
<div class="product-grid">
    {% for product in products %}
        <article class="product-card">
            <div class="product-card-media">{{ product.name|slice:":1"|upper }}</div>
            <div class="product-card-body">
                <div class="product-card-title"><a href="{% url 'storefront:product' product.slug %}">{{ product.name }}</a></div>
            </div>
        </article>
    {% empty %}
        <div class="empty-state"><span class="icon">&#128450;</span>{% tr 'Empty category.' %}</div>
    {% endfor %}
</div>
{% endblock %}
