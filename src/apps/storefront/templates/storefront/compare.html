{% extends "storefront/base.html" %}
{% load strings %}
{% block content %}
<div class="page-title"><h2>{% tr 'Compare' %}</h2></div>
{% if items %}
<div class="panel table-wrap">
    <table class="data">
        <thead><tr><th>{% tr 'Product' %}</th><th></th></tr></thead>
        <tbody>
            {% for item in items %}
                <tr>
                    <td>{{ item.product.name }}</td>
                    <td><a class="btn btn-danger btn-sm" href="{% url 'storefront:compare_remove' item.product.id %}">{% tr 'Remove' %}</a></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}<div class="empty-state"><span class="icon">&#9878;</span>{% tr 'Nothing to compare yet.' %}</div>{% endif %}
{% endblock %}
