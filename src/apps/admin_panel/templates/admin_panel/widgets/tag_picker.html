{% with data_id=widget.attrs.id|default:"id_tags_input"|add:"_data" %}
    <input type="{{ widget.type }}"
           name="{{ widget.name }}"
           {% if widget.value != None %}value="{{ widget.value|stringformat:'s' }}"{% endif %}
           class="{{ widget.attrs.class }}"
           id="{{ widget.attrs.id }}"
           {% if widget.attrs.placeholder %}placeholder="{{ widget.attrs.placeholder }}"{% endif %}
           autocomplete="off">
    {# Tagify reads the existing tag suggestions from this JSON payload. #}
    {{ all_tags|json_script:data_id }}
{% endwith %}
